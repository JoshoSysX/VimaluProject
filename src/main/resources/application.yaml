spring:
  application:
    name: hacienda_vimalu
  datasource:
    url: jdbc:oracle:thin:@localhost:1521/xe
    username: VIMALUBD
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        default_schema: VIMALU

server:
  servlet:
    context-path: /hacienda_vimalu
  port: 8085

storage:
  location: "images"
security:
  jwt:
    secret-key: ${JWT_SECRET:}
    expiration-time: 120000